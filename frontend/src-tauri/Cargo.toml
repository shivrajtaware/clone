[package]
name = "medicore-hms"
version = "1.0.0"
description = "MediCore HMS hospital LAN desktop client"
authors = ["MediCore"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
